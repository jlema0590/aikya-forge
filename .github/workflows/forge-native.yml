name: Forge | Native distribution acceptance
on:
  push:
    branches: [develop]
    paths: &native-inputs
      - 'src/**'
      - 'packages/aikya-pi/**'
      - 'scripts/ci/**'
      - VERSION
      - pyproject.toml
      - setup.py
      - MANIFEST.in
      - README.md
      - README.es.md
      - LICENSE
      - THIRD_PARTY_LICENSES.md
      - requirements-agent-loop.txt
      - docs/AGENT_LOOP.md
      - docs/SECURITY_CONTROLS.md
      - .gitattributes
      - .github/workflows/forge-native.yml
  pull_request:
    branches: [develop, main]
    paths: *native-inputs
  workflow_dispatch:
    inputs:
      artifact_run:
        type: string
        default: ''
        description: Temporary assembly diagnostic using a completed native CI run
      artifact_source:
        type: string
        default: ''
        description: Exact source commit executed by all seven retained native jobs
  workflow_call:
permissions:
  contents: read
concurrency:
  group: forge-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Prepare contributor tools, never model credentials
        run: |
          python -m pip install 'setuptools>=77' wheel build
          python -m pip install --no-build-isolation --no-deps .
      - name: Validate bootstrap failures before building native payloads
        run: python -B -m unittest discover -s tests -p test_managed_bootstrap_entries.py -v
      - name: Build, install, observe memory, update, rollback and uninstall
        id: native
        run: python scripts/ci/native_build_job.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-native-${{ steps.native.outputs.platform }}
          path: ${{ steps.native.outputs.output }}
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-native-failure-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/forge-native-build/acceptance.json
            ${{ runner.temp }}/forge-native-build/**/*.log
          retention-days: 7
  musl:
    if: github.event_name != 'workflow_dispatch' || inputs.artifact_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native musl build and installed acceptance inside Alpine
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/forge-musl"
          docker run --rm \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e FORGE_OWNER_UID="$(id -u)" -e FORGE_OWNER_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/reference:ro" \
            -v "$RUNNER_TEMP/forge-musl:/evidence" \
            alpine:3.23 sh -eu -c '
              trap '\''chown -R "$FORGE_OWNER_UID:$FORGE_OWNER_GID" /evidence'\'' EXIT
              apk add --no-cache python3 py3-pip ca-certificates git libstdc++ libatomic curl tar coreutils
              cp -a /reference /tmp/forge-source
              cd /tmp/forge-source
              python3 -m venv /tmp/contributor
              /tmp/contributor/bin/python -m pip install "setuptools>=77" wheel build
              /tmp/contributor/bin/python -m pip install --no-build-isolation --no-deps .
              /tmp/contributor/bin/python scripts/ci/native_build_job.py --work /evidence/build
            '
      - uses: actions/upload-artifact@v4
        with:
          name: forge-native-linux-x64-musl
          path: ${{ runner.temp }}/forge-musl/build/publish
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: forge-native-failure-musl
          path: |
            ${{ runner.temp }}/forge-musl/build/acceptance.json
            ${{ runner.temp }}/forge-musl/build/**/*.log
          retention-days: 7
  assembly:
    if: github.event_name == 'workflow_dispatch' && inputs.artifact_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps .
      - name: Read the reviewed release workflow's actual artifact selector
        id: selection
        shell: bash
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('.github/workflows/forge-release.yml').read_text()
          pattern=re.search(r'^\s+pattern: (.+)$',text,re.MULTILINE).group(1).strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as stream:stream.write('pattern='+pattern+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ steps.selection.outputs.pattern }}
          run-id: ${{ inputs.artifact_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-inputs
      - name: Verify seven same-commit native archives and universal entries
        shell: bash
        env:
          ARTIFACT_SOURCE: ${{ inputs.artifact_source }}
        run: |
          set -euo pipefail
          python scripts/ci/assemble_terminal_release.py --inputs native-inputs --output release \
            --version "$(cat VERSION)" --commit "$ARTIFACT_SOURCE"
          (cd release && sha256sum --check SHA256SUMS)
          python scripts/ci/release_contract.py notes --output release/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: forge-reviewed-release-diagnostic
          path: release/
          retention-days: 7
          if-no-files-found: error
