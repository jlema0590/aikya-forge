name: Forge | Native distribution acceptance
on:
  push:
    branches: [develop]
    paths: &native-inputs
      - 'src/**'
      - 'packages/aikya-pi/**'
      - 'scripts/ci/**'
      - VERSION
      - pyproject.toml
      - setup.py
      - MANIFEST.in
      - README.md
      - README.es.md
      - LICENSE
      - THIRD_PARTY_LICENSES.md
      - requirements-agent-loop.txt
      - docs/AGENT_LOOP.md
      - docs/SECURITY_CONTROLS.md
      - .gitattributes
      - .github/workflows/forge-native.yml
  pull_request:
    branches: [develop, main]
    paths: *native-inputs
  workflow_dispatch:
    inputs:
      observer_diagnostic:
        type: boolean
        default: false
        description: Run the temporary installed Windows ARM observer diagnostic
  workflow_call:
permissions:
  contents: read
concurrency:
  group: forge-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: github.event_name != 'workflow_dispatch' || !inputs.observer_diagnostic
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: macos-15-intel
            arch: x64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
      - name: Prepare contributor tools, never model credentials
        run: |
          python -m pip install 'setuptools>=77' wheel build
          python -m pip install --no-build-isolation --no-deps .
      - name: Validate bootstrap failures before building native payloads
        run: python -B -m unittest discover -s tests -p test_managed_bootstrap_entries.py -v
      - name: Build, install, observe memory, update, rollback and uninstall
        id: native
        run: python scripts/ci/native_build_job.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: forge-native-${{ steps.native.outputs.platform }}
          path: ${{ steps.native.outputs.output }}
          if-no-files-found: error
          retention-days: 7
      - name: Retain bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-native-failure-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/forge-native-build/acceptance.json
            ${{ runner.temp }}/forge-native-build/**/*.log
          retention-days: 7
  musl:
    if: github.event_name != 'workflow_dispatch' || !inputs.observer_diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native musl build and installed acceptance inside Alpine
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/forge-musl"
          docker run --rm \
            -e GITHUB_SHA="$GITHUB_SHA" \
            -e FORGE_OWNER_UID="$(id -u)" -e FORGE_OWNER_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/reference:ro" \
            -v "$RUNNER_TEMP/forge-musl:/evidence" \
            alpine:3.23 sh -eu -c '
              trap '\''chown -R "$FORGE_OWNER_UID:$FORGE_OWNER_GID" /evidence'\'' EXIT
              apk add --no-cache python3 py3-pip ca-certificates git libstdc++ libatomic curl tar coreutils
              cp -a /reference /tmp/forge-source
              cd /tmp/forge-source
              python3 -m venv /tmp/contributor
              /tmp/contributor/bin/python -m pip install "setuptools>=77" wheel build
              /tmp/contributor/bin/python -m pip install --no-build-isolation --no-deps .
              /tmp/contributor/bin/python scripts/ci/native_build_job.py --work /evidence/build
            '
      - uses: actions/upload-artifact@v4
        with:
          name: forge-native-linux-x64-musl
          path: ${{ runner.temp }}/forge-musl/build/publish
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: forge-native-failure-musl
          path: |
            ${{ runner.temp }}/forge-musl/build/acceptance.json
            ${{ runner.temp }}/forge-musl/build/**/*.log
          retention-days: 7
  observer:
    if: github.event_name == 'workflow_dispatch' && inputs.observer_diagnostic
    runs-on: windows-11-arm
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Require unchanged production inputs for the retained native artifact
        shell: pwsh
        run: |
          git diff --exit-code 4ce714fd00e10149c5331f45bef28602bd085254 -- src packages/aikya-pi/src packages/aikya-pi/package.json packages/aikya-pi/package-lock.json
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic artifact production inputs differ' }
          python -m pip install 'setuptools>=77' wheel
          python -m pip install --no-build-isolation --no-deps .
      - uses: actions/download-artifact@v4
        with:
          name: forge-native-win32-arm64
          run-id: 45211782923
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-inputs
      - name: Probe fresh installed observers without inference
        run: python scripts/ci/native_observer_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge-observer-diagnostic
          path: observer-probe/**/*.log
          if-no-files-found: warn
          retention-days: 7
