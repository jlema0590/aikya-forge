name: Forge | Pull request acceptance
on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
concurrency:
  group: forge-pr-${{ github.event.pull_request.number }}-${{ (github.event.action != 'edited' || github.event.changes.base != null) && 'analysis' || 'metadata' }}
  cancel-in-progress: true
jobs:
  route:
    name: Classify PR event
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      analyze: ${{ steps.event.outputs.analyze }}
      context: ${{ steps.event.outputs.context }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: event
        run: python3 scripts/ci/pr_event.py --event "$GITHUB_EVENT_PATH"
  contracts:
    needs: route
    if: needs.route.outputs.analyze == 'true'
    name: Complete project contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install contributor tools
        run: |
          python -m pip install 'setuptools>=77' wheel build
          python -m pip install --no-build-isolation -e ".[terminal]"
      - name: Verify all assets, profiles, templates and static token policy
        run: |
          python -m compileall -q src scripts/ci
          python scripts/ci/check_assets.py
          python scripts/ci/smoke_profiles.py
          python -m aikya.documentation.templates check
          python scripts/ci/context_budget.py --max-proxy-tokens 6000
      - name: Verify version and changelog against this PR base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/ci/release_contract.py check --base-ref "$PR_BASE_SHA"
  python:
    needs: route
    if: needs.route.outputs.analyze == 'true'
    uses: ./.github/workflows/tests.yml
  runtime:
    needs: route
    if: needs.route.outputs.analyze == 'true'
    uses: ./.github/workflows/pi-runtime.yml
  installers:
    needs: route
    if: needs.route.outputs.analyze == 'true'
    uses: ./.github/workflows/installers.yml
  native:
    needs: route
    if: needs.route.outputs.analyze == 'true'
    uses: ./.github/workflows/forge-native.yml
  publication:
    name: Publication readiness | informational
    needs: route
    if: needs.route.outputs.analyze == 'true'
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      status: ${{ steps.readiness.outputs.status }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps .
      - name: Report readiness without approving publication
        id: readiness
        run: |
          python scripts/ci/forge_release_gate.py --status --version "$(cat VERSION)" \
            --report "$GITHUB_WORKSPACE/aikya/docs/validation/forge-provider-acceptance.json"
  acceptance:
    name: ${{ (github.event.action != 'edited' || github.event.changes.base != null) && format('Forge PR acceptance | {0}', github.event.pull_request.base.ref) || 'PR metadata update' }}
    # Schedule metadata completion too: skipped jobs retain an unresolved name
    # expression, which makes GitHub lose the required source-check identity.
    if: always()
    needs: [route, contracts, python, runtime, installers, native, publication]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require every mandatory stage and publish a consolidated summary
        if: needs.route.result != 'success' || needs.route.outputs.analyze == 'true'
        env:
          AIKYA_PR_NEEDS: ${{ toJSON(needs) }}
          AIKYA_PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: python scripts/ci/pr_acceptance.py --base "$AIKYA_PR_BASE"
