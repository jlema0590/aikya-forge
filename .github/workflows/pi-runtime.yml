name: Pi runtime contracts
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0', '26.13.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/aikya-pi/package-lock.json
      - run: python -m pip install .
      - run: python -B -m unittest discover -s tests -p test_service_bridge.py -v
      - run: python -B -m unittest discover -s tests -p test_service_authorization.py -v
      - run: python -B -m unittest discover -s tests -p 'test_pi_*.py' -v
      - run: python -B -m unittest discover -s tests -p test_v8_migration.py -v
      - run: python -B -m unittest discover -s tests -p 'test_review_*.py' -v
      - run: python -B -m unittest discover -s tests -p test_terminal_entrypoint.py -v
      - run: python -B -m unittest discover -s tests -p 'test_managed_*.py' -v
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: packages/aikya-pi
      - run: npm run typecheck
        working-directory: packages/aikya-pi
      - run: npm test
        working-directory: packages/aikya-pi
        env:
          AIKYA_TEST_PYTHON: python
