name: Pi runtime contracts
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0', '26.13.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/aikya-pi/package-lock.json
      - run: python -m pip install 'setuptools>=77' wheel build
      - run: python -m pip install --no-build-isolation .
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: packages/aikya-pi
      - run: npm run typecheck
        working-directory: packages/aikya-pi
      - name: Verify bounded native terminal input, resize and process cleanup
        run: python -B -m unittest discover -s tests -p test_terminal_pty_capture.py -v
      - run: npm test
        working-directory: packages/aikya-pi
        env:
          AIKYA_TEST_PYTHON: python
      - name: Repeat the Windows final-record resumption without changing its limits
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($trial = 1; $trial -le 3; $trial++) {
            node --test --test-name-pattern="resuming a declined final record" packages/aikya-pi/tests/task-run.test.ts
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        env:
          AIKYA_TEST_PYTHON: python
      - name: Exercise the actual offline terminal, theme confirmation and resize
        shell: bash
        run: python scripts/ci/terminal_pty_acceptance.py --source . --fetch-tools --output "$RUNNER_TEMP/forge-interactive"
      - name: Retain bounded PTY evidence, never project or authentication state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-pty-${{ runner.os }}-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/forge-interactive/*.ansi
            ${{ runner.temp }}/forge-interactive/terminal.log
            ${{ runner.temp }}/forge-interactive/pty-result.json
          if-no-files-found: ignore
          retention-days: 7
      - run: python -B -m unittest discover -s tests -p test_service_bridge.py -v
      - run: python -B -m unittest discover -s tests -p test_service_authorization.py -v
      - run: python -B -m unittest discover -s tests -p 'test_pi_*.py' -v
      - run: python -B -m unittest discover -s tests -p test_v8_migration.py -v
      - run: python -B -m unittest discover -s tests -p 'test_review_*.py' -v
      - run: python -B -m unittest discover -s tests -p test_terminal_entrypoint.py -v
      - run: python -B -m unittest discover -s tests -p 'test_managed_*.py' -v
