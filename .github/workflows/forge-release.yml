name: Forge | Prepare or publish verified native release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish reviewed stable release and update Pages (main only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: forge-release
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Plan a new release, an immutable retry or manual preparation
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGE_PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
        run: python scripts/ci/forge_release_plan.py
  verify:
    needs: plan
    if: needs.plan.outputs.mode == 'publish' || needs.plan.outputs.mode == 'prepare'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - run: |
          python -m pip install 'setuptools>=77' wheel build
          python -m pip install --no-build-isolation -e ".[terminal]"
          python scripts/ci/release_contract.py check
          python -B -m unittest discover -s tests -p 'test_*.py' -q
          python scripts/ci/check_assets.py
          python scripts/ci/smoke_profiles.py
      - run: |
          npm --prefix packages/aikya-pi ci --ignore-scripts --no-audit --no-fund
          npm --prefix packages/aikya-pi run typecheck
          npm --prefix packages/aikya-pi test
        env:
          AIKYA_TEST_PYTHON: python
      - name: Require main and separately reviewed real-provider evidence before publication
        if: needs.plan.outputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python scripts/ci/forge_release_gate.py --version "$(cat VERSION)" \
            --report "$GITHUB_WORKSPACE/aikya/docs/validation/forge-provider-acceptance.json"
  native:
    needs: [plan, verify]
    uses: ./.github/workflows/forge-native.yml
  assemble:
    needs: [plan, verify, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps .
      - uses: actions/download-artifact@v4
        with:
          pattern: forge-native-[dlw]*
          path: native-inputs
      - name: Verify complete same-commit archives and assemble universal entries
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/assemble_terminal_release.py --inputs native-inputs --output release \
            --version "$(cat VERSION)" --commit "$GITHUB_SHA"
          (cd release && sha256sum --check SHA256SUMS)
          python scripts/ci/release_contract.py notes --output release/RELEASE_NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: forge-reviewed-release
          path: release/
          retention-days: 30
          if-no-files-found: error
  publish:
    if: needs.plan.outputs.mode == 'publish' && github.ref == 'refs/heads/main' && github.repository == 'jlema0590/aikya-forge'
    needs: [plan, verify, native, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps .
      - uses: actions/download-artifact@v4
        with:
          name: forge-reviewed-release
          path: release
      - name: Recheck evidence and create a new release without replacing existing assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          python scripts/ci/forge_release_gate.py --version "$VERSION" \
            --report "$GITHUB_WORKSPACE/aikya/docs/validation/forge-provider-acceptance.json"
          (cd release && sha256sum --check SHA256SUMS)
          python scripts/ci/github_tag.py --repository "$GITHUB_REPOSITORY" \
            --tag "v$VERSION" --sha "$GITHUB_SHA"
          mapfile -t ASSETS < <(python -c 'from pathlib import Path; from aikya.installation.bootstrap.download import parse_checksums; print("\n".join("release/"+n for n in parse_checksums(Path("release/SHA256SUMS").read_bytes())))')
          gh release create "v$VERSION" "${ASSETS[@]}" release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "Aikya Forge v$VERSION" --notes-file release/RELEASE_NOTES.md --latest
  pages:
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && ((needs.plan.outputs.mode == 'publish' && needs.publish.result == 'success') || needs.plan.outputs.mode == 'pages') }}
    needs: [plan, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-deps .
      - name: Build Pages from exact published entry bytes
        shell: bash
        run: |
          set -euo pipefail
          gh release download "${{ needs.plan.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --dir published \
            --pattern install.sh --pattern install.ps1 --pattern terminal-bootstrap.json \
            --pattern release.json --pattern SHA256SUMS
          python scripts/ci/forge_install_pages.py --version "${{ needs.plan.outputs.version }}" \
            --assets published --output site --commit "${{ needs.plan.outputs.source_commit }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
      - name: Verify public installer bytes
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          python - <<'PY'
          import os, pathlib, urllib.request
          base=os.environ['PAGES_URL'].rstrip('/')+'/'
          for name in ('install.sh','install.ps1.txt','provenance.json'):
              with urllib.request.urlopen(base+name,timeout=30) as response:
                  if response.read()!=(pathlib.Path('site')/name).read_bytes():
                      raise SystemExit('Public installer bytes differ: '+name)
                  if name.endswith('.txt') and not response.headers.get_content_type().startswith('text/'):
                      raise SystemExit('PowerShell entry must be served as text')
          PY
